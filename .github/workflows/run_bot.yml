name: 뉴스봇 - 크롤링 & Discord 포스팅

on:
  schedule:
    # 매 시간 정각 실행 (UTC 기준 → 한국 시간 +9시간)
    # 예: UTC 00:00 = KST 09:00
    - cron: '0 * * * *'
  workflow_dispatch:
    # GitHub Actions 페이지에서 수동 실행 버튼 활성화

permissions:
  contents: write   # seen_posts.json 커밋 권한

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: playwright install chromium --with-deps

      - name: 봇 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      - name: seen_posts.json 저장 (변경된 경우만 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git diff --staged --quiet || git commit -m "chore: update seen posts [skip ci]"
          git push
